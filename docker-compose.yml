version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gamesphere-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gamesphere_db
      POSTGRES_USER: gamesphere
      POSTGRES_PASSWORD: gamesphere
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - gamesphere-network

volumes:
  postgres_data:

networks:
  gamesphere-network:
    driver: bridge