spring:
  application:
    name: gamesphere
  datasource:
    url: jdbc:postgresql://localhost:5433/gamesphere_db
    username: gamesphere
    password: gamesphere
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.yaml
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

app:
  storage:
    upload-dir: ${APP_STORAGE_UPLOAD_DIR:${user.home}/gamesphere-uploads}
  mail:
    enabled: ${MAIL_ENABLED:false}
    frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  stripe:
    enabled: ${STRIPE_ENABLED:false}
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
    currency: ${STRIPE_CURRENCY:usd}
    success-url: ${STRIPE_SUCCESS_URL:http://localhost:3000/payment/success?session_id={CHECKOUT_SESSION_ID}}
    cancel-url: ${STRIPE_CANCEL_URL:http://localhost:3000/payment/cancel}

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:mySuperSecretJwtKeyForGamesphere2026MustBeVeryLongAndSecureHereAtLeast256Bits}
  access-expiration: ${JWT_ACCESS_EXPIRATION:900000}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:2592000000}

logging:
  level:
    com.example.gamesphere: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

